services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-laravel-app
    container_name: laravel-app
    restart: always
    volumes:
      - .:/var/www
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    container_name: webserver
    ports:
      - 80:80
      - 443:443
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
